name: Cloud Shell Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ping Cloud Shell via SSH
        run: |
          gcloud cloud-shell ssh --project=re-v-app \
            --authorize-session \
            --command="curl -sf http://localhost:20128/health && echo ' alive'" \
            -- -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            2>&1 || echo "Cloud Shell sleeping"
