name: Cloud Shell Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:           # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hermes Dashboard
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://8080-cs-03795caa-1265-4dee-b9fd-52dffe56c3a5.cs-asia-southeast1-fork.cloudshell.dev/?profile=default" \
            --max-time 10 || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Cloud Shell alive"
          else
            echo "Cloud Shell sleeping or unreachable (status: $STATUS)"
          fi
